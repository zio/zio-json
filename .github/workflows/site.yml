# This file was autogenerated using `zio-sbt-website` via `sbt generateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: Website
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - series/2.x
  pull_request: {}
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: '0'
    - name: Setup Action
      uses: coursier/setup-action@v3
      with:
        jvm: temurin:17
        apps: sbt
    - name: Check artifacts build process
      run: sbt  +publishLocal
    - name: Check website build process
      run: sbt docs/clean; sbt  docs/buildWebsite
  release-docs:
    name: Release Docs
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
      - release
    if: ${{ ((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Setup Scala
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          check-latest: true
      - name: Setup SBT
        uses: sbt/setup-sbt@v1
      - name: Cache Dependencies
        uses: coursier/cache-action@v7
      - name: Setup NodeJs
        uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
      - name: Publish Docs to NPM Registry
        run: sbt docs/publishToNpm
  generate-readme:
    name: Generate README
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push') || ((github.event_name == 'release') && (github.event.action == 'published')) }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6.0.2
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: '0'
    - name: Setup Action
      uses: coursier/setup-action@v3
      with:
        jvm: temurin:17
        apps: sbt
    - name: Commit Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add README.md
        git commit -m "Update README.md" || echo "No changes to commit"
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        body: |-
          Autogenerated changes after running the `sbt docs/generateReadme` command of the [zio-sbt-website](https://zio.dev/zio-sbt) plugin.

          I will automatically update the README.md file whenever there is new change for README.md, e.g.
            - After each release, I will update the version in the installation section.
            - After any changes to the "docs/index.md" file, I will update the README.md file accordingly.
        branch: zio-sbt-website/update-readme
        commit-message: Update README.md
        delete-branch: true
        base: series/2.x
        title: Update README.md
