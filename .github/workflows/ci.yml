name: CI

env:
  JDK_JAVA_OPTIONS: -XX:+PrintCommandLineFlags # JDK_JAVA_OPTIONS is _the_ env. variable to use for modern Java
  JVM_OPTS: -XX:+PrintCommandLineFlags # for Java 8 only (sadly, it is not modern enough for JDK_JAVA_OPTIONS)

on:
  pull_request:
  push:
    branches: ['series/2.x']
  release:
    types:
      - published

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Setup Action
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:11
          apps: sbt
      - name: Cache scala dependencies
        uses: coursier/cache-action@v6
      - name: Lint code
        run: sbt "++2.12; check; ++2.13; check; ++3.3; check"

  benchmarks:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
        scala: ['2.13.16', '3.3.7']
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Setup Action
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:${{ matrix.java }}
          apps: sbt
      - name: Cache scala dependencies
        uses: coursier/cache-action@v6
      - name: Compile benchmarks
        run: sbt ++${{ matrix.scala }}! jmh:compile

  mdoc:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5.0.0
      - name: Setup Action
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:11
          apps: sbt
      - name: Cache scala dependencies
        uses: coursier/cache-action@v6
      - name: Check Document Generation
        run: sbt compileDocs

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
        scala: ['2.12.20', '2.13.16', '3.3.7']
        platform: ['JVM', 'JS', 'Native']
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Install Boehm GC
        if: ${{ startsWith(matrix.platform, 'Native') }}
        run: sudo apt-get update && sudo apt-get install -y libgc-dev
      - name: Setup Action
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:${{ matrix.java }}
          apps: sbt
      - name: Cache scala dependencies
        uses: coursier/cache-action@v6
      - name: Install libuv
        if: matrix.platform == 'Native'
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev
      - name: Run Macros tests
        if: ${{ !startsWith(matrix.scala, '3.3.') }}
        run: sbt ++${{ matrix.scala }}! testScala2${{ matrix.platform }}
      - name: Run tests
        run: sbt ++${{ matrix.scala }}! test${{ matrix.platform }}

  mima_check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 300
      - name: Fetch tags
        run: git fetch --depth=300 origin +refs/tags/*:refs/tags/*
      - name: Setup Action
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:11
          apps: sbt
      - run: sbt +mimaReportBinaryIssues

  ci:
    runs-on: ubuntu-22.04
    needs: [lint, mdoc, benchmarks, test, mima_check]
    steps:
      - name: Aggregate of lint, and all tests
        run: echo "ci passed"

  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: [ci]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: Setup Action
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:11
          apps: sbt
      - name: Release
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
